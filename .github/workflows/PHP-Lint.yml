name: PHP Lint
on: [push, pull_request]
jobs:
  phplint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check Syntax Error
        run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
